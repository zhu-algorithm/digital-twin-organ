name: TDLN digital twin CI

on:
  push:
    branches: [main, rebuild/tdln-pd1-response]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints/py310-312.txt -e '.[test]'
      - name: Record locked numerical environment
        run: |
          python -c "import sys,numpy,pandas,scipy,sklearn,joblib; print({'python':sys.version.split()[0],'numpy':numpy.__version__,'pandas':pandas.__version__,'scipy':scipy.__version__,'scikit_learn':sklearn.__version__,'joblib':joblib.__version__})"
      - run: pytest -q
      - name: Verify dashboard model export is reproducible
        run: |
          python scripts/export_tdln_dashboard.py
          python scripts/export_liver_tumor_dashboard.py
          git diff --exit-code -- docs/data/tdln_dashboard.json docs/data/liver_tumor_dashboard.json
      - name: Verify end-to-end digital twin pipeline
        run: |
          tdln-pd1 featurize --cells examples/cells.csv --cell-type-map examples/cell_type_map.csv --cell-type-vocabulary 'CD8 T,DC,Treg' --output /tmp/features.csv
          tdln-pd1 verify-features --audit /tmp/features.csv.feature-audit.json --cells examples/cells.csv --cell-type-map examples/cell_type_map.csv --output /tmp/features.csv
          python scripts/simulate_patient_liver_tdln.py --features /tmp/features.csv --patient-id p0 --days 3 --step 0.5 --dose-days 0 --paired-counterfactual --portal-flow-multiplier 0.8 --arterial-flow-multiplier 0.6 --output /tmp/patient_liver_tdln
          test -f /tmp/patient_liver_tdln/patient_liver_tdln_audit.json
          test -f /tmp/patient_liver_tdln/patient_liver_tdln_counterfactual.json
          tdln-pd1 calibrate-feature-state-mapping --observations examples/feature_state_mapping_observations.csv --fit tcf7_coefficient --base-mapping examples/feature_state_mapping.json --output /tmp/mapping_calibration
          tdln-pd1 verify-calibration --audit /tmp/mapping_calibration/mapping_calibration_provenance.json --observations examples/feature_state_mapping_observations.csv --base-mapping examples/feature_state_mapping.json
          tdln-pd1 qc --cells examples/cells.csv --labels examples/labels.csv --manifest examples/cohort_manifest.json --cell-type-map examples/cell_type_map.csv --cell-type-vocabulary 'CD8 T,DC,Treg' --output /tmp/qc.json
          tdln-pd1 calibrate --observations examples/longitudinal_observations.csv --fit tumour_growth --profile-points 5 --output /tmp/calibration
          tdln-pd1 verify-calibration --audit /tmp/calibration/calibration_provenance.json --observations examples/longitudinal_observations.csv
          tdln-pd1 propagate-uncertainty --parameters /tmp/calibration/fitted_parameters.json --diagnostics /tmp/calibration/calibration_diagnostics.json --days 7 --dose-days 0 --samples 8 --output /tmp/uncertainty
          tdln-pd1 verify-uncertainty --audit /tmp/uncertainty/uncertainty_provenance.json --parameters /tmp/calibration/fitted_parameters.json --diagnostics /tmp/calibration/calibration_diagnostics.json
          tdln-pd1 calibrate-spatial --observations examples/spatial_longitudinal_observations.csv --fit antigen_decay --max-nfev 80 --profile-points 5 --output /tmp/spatial_calibration
          tdln-pd1 verify-calibration --audit /tmp/spatial_calibration/spatial_calibration_provenance.json --observations examples/spatial_longitudinal_observations.csv
          python scripts/calibrate_liver_tdln_bridge.py --observations examples/liver_tdln_bridge_observations.csv --fit bridge.antigen_drainage_gain,bridge.dc_migration_gain --output /tmp/liver_bridge_calibration --max-nfev 60
          tdln-pd1 verify-calibration --audit /tmp/liver_bridge_calibration/liver_tdln_bridge_provenance.json --observations examples/liver_tdln_bridge_observations.csv
          python scripts/calibrate_liver_feature_bridge.py --observations examples/liver_feature_bridge_mapping_observations.csv --fit killing_cytotoxic_coefficient --output /tmp/liver_feature_bridge_calibration --max-nfev 60
          tdln-pd1 verify-calibration --audit /tmp/liver_feature_bridge_calibration/liver_feature_bridge_mapping_provenance.json --observations examples/liver_feature_bridge_mapping_observations.csv
          python scripts/simulate_patient_liver_tdln.py --features /tmp/features.csv --patient-id p0 --days 3 --step 0.5 --dose-days 0 --paired-counterfactual --systemic-parameters /tmp/calibration/fitted_parameters.json --spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --liver-bridge-parameters /tmp/liver_bridge_calibration/fitted_liver_tdln_bridge.json --feature-bridge-mapping /tmp/liver_feature_bridge_calibration/fitted_liver_feature_bridge_mapping.json --feature-state-mapping /tmp/mapping_calibration/fitted_feature_state_mapping.json --output /tmp/calibrated_patient_liver_tdln
          test -f /tmp/calibrated_patient_liver_tdln/patient_liver_tdln_audit.json
          python scripts/augment_liver_tdln_counterfactual.py --features /tmp/features.csv --days 3 --step 0.5 --treatment-manifest examples/treatment_manifest.csv --perfusion-manifest examples/perfusion_manifest.csv --systemic-parameters /tmp/calibration/fitted_parameters.json --systemic-diagnostics /tmp/calibration/calibration_diagnostics.json --spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --spatial-diagnostics /tmp/spatial_calibration/spatial_calibration_diagnostics.json --feature-state-mapping /tmp/mapping_calibration/fitted_feature_state_mapping.json --feature-state-diagnostics /tmp/mapping_calibration/mapping_calibration_diagnostics.json --bridge-parameters /tmp/liver_bridge_calibration/fitted_liver_tdln_bridge.json --bridge-diagnostics /tmp/liver_bridge_calibration/liver_tdln_bridge_diagnostics.json --feature-bridge-mapping /tmp/liver_feature_bridge_calibration/fitted_liver_feature_bridge_mapping.json --feature-bridge-diagnostics /tmp/liver_feature_bridge_calibration/liver_feature_bridge_mapping_diagnostics.json --uncertainty-samples 4 --uncertainty-seed 42 --output /tmp/liver_cf_features.csv
          python -c "import json; json.dump({'features':'/tmp/features.csv','treatment_manifest':'examples/treatment_manifest.csv','perfusion_manifest':'examples/perfusion_manifest.csv','systemic_parameters':'/tmp/calibration/fitted_parameters.json','systemic_diagnostics':'/tmp/calibration/calibration_diagnostics.json','spatial_parameters':'/tmp/spatial_calibration/fitted_spatial_parameters.json','spatial_diagnostics':'/tmp/spatial_calibration/spatial_calibration_diagnostics.json','feature_state_mapping':'/tmp/mapping_calibration/fitted_feature_state_mapping.json','feature_state_diagnostics':'/tmp/mapping_calibration/mapping_calibration_diagnostics.json','bridge_parameters':'/tmp/liver_bridge_calibration/fitted_liver_tdln_bridge.json','bridge_diagnostics':'/tmp/liver_bridge_calibration/liver_tdln_bridge_diagnostics.json','feature_bridge_mapping':'/tmp/liver_feature_bridge_calibration/fitted_liver_feature_bridge_mapping.json','feature_bridge_diagnostics':'/tmp/liver_feature_bridge_calibration/liver_feature_bridge_mapping_diagnostics.json'},open('/tmp/liver_replay_train.json','w'))"
          tdln-pd1 spatial-featurize --spots examples/spatial_spots_cohort.csv --weight-column area --time-column sampling_day --baseline-values 0 --output /tmp/spatial_cohort_initial.csv
          tdln-pd1 verify-spatial-features --audit /tmp/spatial_cohort_initial.csv.spatial-audit.json --spots examples/spatial_spots_cohort.csv --output /tmp/spatial_cohort_initial.csv
          tdln-pd1 propagate-spatial-uncertainty --parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --diagnostics /tmp/spatial_calibration/spatial_calibration_diagnostics.json --systemic-parameters /tmp/calibration/fitted_parameters.json --initial-zones /tmp/spatial_cohort_initial.csv --patient-id p0 --days 3 --dose-days 0 --samples 8 --output /tmp/spatial_uncertainty
          tdln-pd1 verify-spatial-uncertainty --audit /tmp/spatial_uncertainty/uncertainty_provenance.json --parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --diagnostics /tmp/spatial_calibration/spatial_calibration_diagnostics.json --systemic-parameters /tmp/calibration/fitted_parameters.json --initial-zones /tmp/spatial_cohort_initial.csv
          tdln-pd1 augment-twin --features /tmp/liver_cf_features.csv --spatial-initial-zones /tmp/spatial_cohort_initial.csv --systemic-parameters /tmp/calibration/fitted_parameters.json --spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --feature-state-mapping /tmp/mapping_calibration/fitted_feature_state_mapping.json --systemic-diagnostics /tmp/calibration/calibration_diagnostics.json --spatial-diagnostics /tmp/spatial_calibration/spatial_calibration_diagnostics.json --mapping-diagnostics /tmp/mapping_calibration/mapping_calibration_diagnostics.json --uncertainty-samples 4 --uncertainty-seed 42 --days 7 --dose-days 0 --output /tmp/hybrid.csv
          tdln-pd1 verify-augmentation --audit /tmp/hybrid.csv.twin-audit.json --output /tmp/hybrid.csv --features /tmp/liver_cf_features.csv --spatial-initial-zones /tmp/spatial_cohort_initial.csv --systemic-parameters /tmp/calibration/fitted_parameters.json --spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --feature-state-mapping /tmp/mapping_calibration/fitted_feature_state_mapping.json --systemic-diagnostics /tmp/calibration/calibration_diagnostics.json --spatial-diagnostics /tmp/spatial_calibration/spatial_calibration_diagnostics.json --mapping-diagnostics /tmp/mapping_calibration/mapping_calibration_diagnostics.json --liver-replay-manifest /tmp/liver_replay_train.json
          tdln-pd1 train --features /tmp/hybrid.csv --labels examples/labels.csv --output /tmp/model --folds 2 --augmentation-features /tmp/liver_cf_features.csv --augmentation-liver-replay-manifest /tmp/liver_replay_train.json --augmentation-spatial-initial-zones /tmp/spatial_cohort_initial.csv --augmentation-systemic-parameters /tmp/calibration/fitted_parameters.json --augmentation-spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --augmentation-feature-state-mapping /tmp/mapping_calibration/fitted_feature_state_mapping.json --augmentation-systemic-diagnostics /tmp/calibration/calibration_diagnostics.json --augmentation-spatial-diagnostics /tmp/spatial_calibration/spatial_calibration_diagnostics.json --augmentation-mapping-diagnostics /tmp/mapping_calibration/mapping_calibration_diagnostics.json
          tdln-pd1 predict --model /tmp/model/model.joblib --features /tmp/hybrid.csv --output /tmp/training_predictions.csv --augmentation-features /tmp/liver_cf_features.csv --augmentation-liver-replay-manifest /tmp/liver_replay_train.json --augmentation-spatial-initial-zones /tmp/spatial_cohort_initial.csv --augmentation-systemic-parameters /tmp/calibration/fitted_parameters.json --augmentation-spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --augmentation-feature-state-mapping /tmp/mapping_calibration/fitted_feature_state_mapping.json --augmentation-systemic-diagnostics /tmp/calibration/calibration_diagnostics.json --augmentation-spatial-diagnostics /tmp/spatial_calibration/spatial_calibration_diagnostics.json --augmentation-mapping-diagnostics /tmp/mapping_calibration/mapping_calibration_diagnostics.json
          if tdln-pd1 evaluate --predictions /tmp/training_predictions.csv --model /tmp/model/model.joblib --features /tmp/hybrid.csv --labels examples/labels.csv --output /tmp/invalid_metrics.json --bootstrap 20 --augmentation-features /tmp/liver_cf_features.csv --augmentation-liver-replay-manifest /tmp/liver_replay_train.json --augmentation-spatial-initial-zones /tmp/spatial_cohort_initial.csv --augmentation-systemic-parameters /tmp/calibration/fitted_parameters.json --augmentation-spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --augmentation-feature-state-mapping /tmp/mapping_calibration/fitted_feature_state_mapping.json --augmentation-systemic-diagnostics /tmp/calibration/calibration_diagnostics.json --augmentation-spatial-diagnostics /tmp/spatial_calibration/spatial_calibration_diagnostics.json --augmentation-mapping-diagnostics /tmp/mapping_calibration/mapping_calibration_diagnostics.json; then exit 1; fi
          python -c "import pandas as pd; x=pd.read_csv('/tmp/features.csv'); old=x.patient_id.astype(str).tolist(); new=['external_smoke_'+str(i) for i in range(len(x))]; ids=dict(zip(old,new)); x['patient_id']=new; x['sig_cytotoxic']=x['sig_cytotoxic']+1e-6; x.to_csv('/tmp/external_base.csv',index=False); s=pd.read_csv('/tmp/spatial_cohort_initial.csv'); s['patient_id']=s.patient_id.astype(str).map(ids); s.to_csv('/tmp/external_spatial.csv',index=False); t=pd.read_csv('examples/treatment_manifest.csv'); t['patient_id']=t.patient_id.astype(str).map(ids); t.to_csv('/tmp/external_treatment.csv',index=False); f=pd.read_csv('examples/perfusion_manifest.csv'); f['patient_id']=f.patient_id.astype(str).map(ids); f.to_csv('/tmp/external_perfusion.csv',index=False); y=pd.read_csv('examples/labels.csv'); y['patient_id']=y.patient_id.astype(str).map(ids); y.to_csv('/tmp/external_smoke_labels.csv',index=False)"
          python scripts/augment_liver_tdln_counterfactual.py --features /tmp/external_base.csv --days 3 --step 0.5 --treatment-manifest /tmp/external_treatment.csv --perfusion-manifest /tmp/external_perfusion.csv --systemic-parameters /tmp/calibration/fitted_parameters.json --systemic-diagnostics /tmp/calibration/calibration_diagnostics.json --spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --spatial-diagnostics /tmp/spatial_calibration/spatial_calibration_diagnostics.json --feature-state-mapping /tmp/mapping_calibration/fitted_feature_state_mapping.json --feature-state-diagnostics /tmp/mapping_calibration/mapping_calibration_diagnostics.json --bridge-parameters /tmp/liver_bridge_calibration/fitted_liver_tdln_bridge.json --bridge-diagnostics /tmp/liver_bridge_calibration/liver_tdln_bridge_diagnostics.json --feature-bridge-mapping /tmp/liver_feature_bridge_calibration/fitted_liver_feature_bridge_mapping.json --feature-bridge-diagnostics /tmp/liver_feature_bridge_calibration/liver_feature_bridge_mapping_diagnostics.json --uncertainty-samples 4 --uncertainty-seed 42 --output /tmp/external_liver.csv
          python -c "import json; json.dump({'features':'/tmp/external_base.csv','treatment_manifest':'/tmp/external_treatment.csv','perfusion_manifest':'/tmp/external_perfusion.csv','systemic_parameters':'/tmp/calibration/fitted_parameters.json','systemic_diagnostics':'/tmp/calibration/calibration_diagnostics.json','spatial_parameters':'/tmp/spatial_calibration/fitted_spatial_parameters.json','spatial_diagnostics':'/tmp/spatial_calibration/spatial_calibration_diagnostics.json','feature_state_mapping':'/tmp/mapping_calibration/fitted_feature_state_mapping.json','feature_state_diagnostics':'/tmp/mapping_calibration/mapping_calibration_diagnostics.json','bridge_parameters':'/tmp/liver_bridge_calibration/fitted_liver_tdln_bridge.json','bridge_diagnostics':'/tmp/liver_bridge_calibration/liver_tdln_bridge_diagnostics.json','feature_bridge_mapping':'/tmp/liver_feature_bridge_calibration/fitted_liver_feature_bridge_mapping.json','feature_bridge_diagnostics':'/tmp/liver_feature_bridge_calibration/liver_feature_bridge_mapping_diagnostics.json'},open('/tmp/liver_replay_external.json','w'))"
          tdln-pd1 augment-twin --features /tmp/external_liver.csv --spatial-initial-zones /tmp/external_spatial.csv --systemic-parameters /tmp/calibration/fitted_parameters.json --spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --feature-state-mapping /tmp/mapping_calibration/fitted_feature_state_mapping.json --systemic-diagnostics /tmp/calibration/calibration_diagnostics.json --spatial-diagnostics /tmp/spatial_calibration/spatial_calibration_diagnostics.json --mapping-diagnostics /tmp/mapping_calibration/mapping_calibration_diagnostics.json --uncertainty-samples 4 --uncertainty-seed 42 --days 7 --dose-days 0 --output /tmp/external_smoke.csv
          tdln-pd1 predict --model /tmp/model/model.joblib --features /tmp/external_smoke.csv --output /tmp/predictions.csv --augmentation-features /tmp/external_liver.csv --augmentation-liver-replay-manifest /tmp/liver_replay_external.json --augmentation-spatial-initial-zones /tmp/external_spatial.csv --augmentation-systemic-parameters /tmp/calibration/fitted_parameters.json --augmentation-spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --augmentation-feature-state-mapping /tmp/mapping_calibration/fitted_feature_state_mapping.json --augmentation-systemic-diagnostics /tmp/calibration/calibration_diagnostics.json --augmentation-spatial-diagnostics /tmp/spatial_calibration/spatial_calibration_diagnostics.json --augmentation-mapping-diagnostics /tmp/mapping_calibration/mapping_calibration_diagnostics.json
          tdln-pd1 evaluate --predictions /tmp/predictions.csv --model /tmp/model/model.joblib --features /tmp/external_smoke.csv --labels /tmp/external_smoke_labels.csv --output /tmp/external_metrics.json --bootstrap 20 --augmentation-features /tmp/external_liver.csv --augmentation-liver-replay-manifest /tmp/liver_replay_external.json --augmentation-spatial-initial-zones /tmp/external_spatial.csv --augmentation-systemic-parameters /tmp/calibration/fitted_parameters.json --augmentation-spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --augmentation-feature-state-mapping /tmp/mapping_calibration/fitted_feature_state_mapping.json --augmentation-systemic-diagnostics /tmp/calibration/calibration_diagnostics.json --augmentation-spatial-diagnostics /tmp/spatial_calibration/spatial_calibration_diagnostics.json --augmentation-mapping-diagnostics /tmp/mapping_calibration/mapping_calibration_diagnostics.json
          test -f /tmp/predictions.csv.audit.json
          test -f /tmp/external_metrics.json.audit.json
          tdln-pd1 verify-evaluation --audit /tmp/external_metrics.json.audit.json --predictions /tmp/predictions.csv --model /tmp/model/model.joblib --features /tmp/external_smoke.csv --labels /tmp/external_smoke_labels.csv --metrics /tmp/external_metrics.json --augmentation-features /tmp/external_liver.csv --augmentation-liver-replay-manifest /tmp/liver_replay_external.json --augmentation-spatial-initial-zones /tmp/external_spatial.csv --augmentation-systemic-parameters /tmp/calibration/fitted_parameters.json --augmentation-spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --augmentation-feature-state-mapping /tmp/mapping_calibration/fitted_feature_state_mapping.json --augmentation-systemic-diagnostics /tmp/calibration/calibration_diagnostics.json --augmentation-spatial-diagnostics /tmp/spatial_calibration/spatial_calibration_diagnostics.json --augmentation-mapping-diagnostics /tmp/mapping_calibration/mapping_calibration_diagnostics.json
          tdln-pd1 site-cv --features /tmp/hybrid.csv --labels examples/labels_multicenter.csv --bootstrap 20 --output /tmp/site_cv --augmentation-features /tmp/liver_cf_features.csv --augmentation-liver-replay-manifest /tmp/liver_replay_train.json --augmentation-spatial-initial-zones /tmp/spatial_cohort_initial.csv --augmentation-systemic-parameters /tmp/calibration/fitted_parameters.json --augmentation-spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --augmentation-feature-state-mapping /tmp/mapping_calibration/fitted_feature_state_mapping.json --augmentation-systemic-diagnostics /tmp/calibration/calibration_diagnostics.json --augmentation-spatial-diagnostics /tmp/spatial_calibration/spatial_calibration_diagnostics.json --augmentation-mapping-diagnostics /tmp/mapping_calibration/mapping_calibration_diagnostics.json
          tdln-pd1 verify-site-cv --audit /tmp/site_cv/site_cv_provenance.json --features /tmp/hybrid.csv --labels examples/labels_multicenter.csv --metrics /tmp/site_cv/site_cv_metrics.json --predictions /tmp/site_cv/site_cv_predictions.csv --augmentation-features /tmp/liver_cf_features.csv --augmentation-liver-replay-manifest /tmp/liver_replay_train.json --augmentation-spatial-initial-zones /tmp/spatial_cohort_initial.csv --augmentation-systemic-parameters /tmp/calibration/fitted_parameters.json --augmentation-spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --augmentation-feature-state-mapping /tmp/mapping_calibration/fitted_feature_state_mapping.json --augmentation-systemic-diagnostics /tmp/calibration/calibration_diagnostics.json --augmentation-spatial-diagnostics /tmp/spatial_calibration/spatial_calibration_diagnostics.json --augmentation-mapping-diagnostics /tmp/mapping_calibration/mapping_calibration_diagnostics.json
          tdln-pd1 simulate --days 7 --dose-days 0 --parameters /tmp/calibration/fitted_parameters.json --output /tmp/trajectory.csv
          tdln-pd1 simulate-spatial --days 3 --output /tmp/spatial.csv
          tdln-pd1 spatial-featurize --spots examples/spatial_spots.csv --weight-column area --sample-column section_id --sample-aggregation equal_samples --output /tmp/spatial_initial.csv
          python -c "import pandas as pd; x=pd.read_csv('/tmp/spatial_initial.csv').set_index(['species','zone']); assert x.loc[('tpex','paracortex'),'amount'] == 90000.0"
          tdln-pd1 verify-spatial-features --audit /tmp/spatial_initial.csv.spatial-audit.json --spots examples/spatial_spots.csv --output /tmp/spatial_initial.csv
          tdln-pd1 spatial-featurize --spots examples/spatial_spots_partial.csv --weight-column area --sample-column section_id --sample-aggregation equal_observed_samples --output /tmp/spatial_partial.csv
          python -c "import pandas as pd; x=pd.read_csv('/tmp/spatial_partial.csv').set_index(['species','zone']); assert x.loc[('tpex','paracortex'),'amount'] == 80000.0; assert x.loc[('tpex','paracortex'),'sampling_units_observed'] == 1; assert x.loc[('tpex','paracortex'),'sampling_units_total'] == 2; assert x.loc[('tpex','paracortex'),'sampling_unit_coverage'] == 0.5"
          tdln-pd1 verify-spatial-features --audit /tmp/spatial_partial.csv.spatial-audit.json --spots examples/spatial_spots_partial.csv --output /tmp/spatial_partial.csv
          python -c "import pandas as pd; pd.DataFrame({'patient_id':['partial_patient'],'sig_tcf7_memory':[0.5],'sig_cytotoxic':[0.5]}).to_csv('/tmp/partial_features.csv',index=False)"
          tdln-pd1 augment-twin --features /tmp/partial_features.csv --spatial-initial-zones /tmp/spatial_partial.csv --spatial-missing-zone-policy feature_prior --days 1 --dose-days 0 --output /tmp/partial_hybrid.csv
          python -c "import pandas as pd; x=pd.read_csv('/tmp/partial_hybrid.csv').iloc[0]; assert abs(x.qc_spatial_feature_prior_imputed_fraction - 4/6) < 1e-12"
          tdln-pd1 verify-augmentation --audit /tmp/partial_hybrid.csv.twin-audit.json --output /tmp/partial_hybrid.csv --features /tmp/partial_features.csv --spatial-initial-zones /tmp/spatial_partial.csv
          tdln-pd1 simulate-spatial --initial-zones /tmp/spatial_initial.csv --patient-id example_patient --systemic-parameters /tmp/calibration/fitted_parameters.json --spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --days 3 --dose-days 0 --paired-counterfactual --output /tmp/spatial_patient.csv
          tdln-pd1 sensitivity --parameters tumour_growth,killing_rate --days 3 --samples 8 --output /tmp/sensitivity
          tdln-pd1 verify-sensitivity --audit /tmp/sensitivity/sensitivity_provenance.json
          tdln-pd1 spatial-sensitivity --spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --systemic-parameters /tmp/calibration/fitted_parameters.json --initial-zones /tmp/spatial_initial.csv --patient-id example_patient --parameters antigen_half_saturation,checkpoint_growth_gain --days 3 --dose-days 0 --samples 8 --output /tmp/spatial_sensitivity
          tdln-pd1 verify-sensitivity --audit /tmp/spatial_sensitivity/spatial_sensitivity_provenance.json --spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --systemic-parameters /tmp/calibration/fitted_parameters.json --initial-zones /tmp/spatial_initial.csv
          tdln-pd1 verify --output /tmp/verification.json
