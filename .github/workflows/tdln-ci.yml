name: TDLN digital twin CI

on:
  push:
    branches: [main, rebuild/tdln-pd1-response]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - name: Verify dashboard model export is reproducible
        run: |
          python scripts/export_tdln_dashboard.py
          git diff --exit-code -- docs/data/tdln_dashboard.json
      - name: Verify end-to-end digital twin pipeline
        run: |
          tdln-pd1 featurize --cells examples/cells.csv --output /tmp/features.csv
          tdln-pd1 qc --cells examples/cells.csv --labels examples/labels.csv --manifest examples/cohort_manifest.json --output /tmp/qc.json
          tdln-pd1 calibrate --observations examples/longitudinal_observations.csv --fit tumour_growth --profile-points 5 --output /tmp/calibration
          tdln-pd1 verify-calibration --audit /tmp/calibration/calibration_provenance.json --observations examples/longitudinal_observations.csv
          tdln-pd1 calibrate-spatial --observations examples/spatial_longitudinal_observations.csv --fit antigen_decay --max-nfev 80 --profile-points 5 --output /tmp/spatial_calibration
          tdln-pd1 verify-calibration --audit /tmp/spatial_calibration/spatial_calibration_provenance.json --observations examples/spatial_longitudinal_observations.csv
          tdln-pd1 spatial-featurize --spots examples/spatial_spots_cohort.csv --weight-column area --output /tmp/spatial_cohort_initial.csv
          tdln-pd1 augment-twin --features /tmp/features.csv --spatial-initial-zones /tmp/spatial_cohort_initial.csv --systemic-parameters /tmp/calibration/fitted_parameters.json --spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --days 7 --dose-days 0 --output /tmp/hybrid.csv
          tdln-pd1 verify-augmentation --audit /tmp/hybrid.csv.twin-audit.json --output /tmp/hybrid.csv --features /tmp/features.csv --spatial-initial-zones /tmp/spatial_cohort_initial.csv --systemic-parameters /tmp/calibration/fitted_parameters.json --spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json
          tdln-pd1 train --features /tmp/hybrid.csv --labels examples/labels.csv --output /tmp/model --folds 2
          tdln-pd1 predict --model /tmp/model/model.joblib --features /tmp/hybrid.csv --output /tmp/training_predictions.csv
          if tdln-pd1 evaluate --predictions /tmp/training_predictions.csv --labels examples/labels.csv --output /tmp/invalid_metrics.json --bootstrap 20; then exit 1; fi
          python -c "import pandas as pd; x=pd.read_csv('/tmp/hybrid.csv'); x['patient_id']=['external_smoke_'+str(i) for i in range(len(x))]; x['sig_cytotoxic']=x['sig_cytotoxic']+1e-6; x.to_csv('/tmp/external_smoke.csv',index=False); y=pd.read_csv('examples/labels.csv'); y['patient_id']=x['patient_id']; y.to_csv('/tmp/external_smoke_labels.csv',index=False)"
          tdln-pd1 predict --model /tmp/model/model.joblib --features /tmp/external_smoke.csv --output /tmp/predictions.csv
          tdln-pd1 evaluate --predictions /tmp/predictions.csv --labels /tmp/external_smoke_labels.csv --output /tmp/external_metrics.json --bootstrap 20
          test -f /tmp/predictions.csv.audit.json
          test -f /tmp/external_metrics.json.audit.json
          tdln-pd1 site-cv --features /tmp/hybrid.csv --labels examples/labels_multicenter.csv --bootstrap 20 --output /tmp/site_cv
          tdln-pd1 simulate --days 7 --dose-days 0 --parameters /tmp/calibration/fitted_parameters.json --output /tmp/trajectory.csv
          tdln-pd1 simulate-spatial --days 3 --output /tmp/spatial.csv
          tdln-pd1 spatial-featurize --spots examples/spatial_spots.csv --weight-column area --output /tmp/spatial_initial.csv
          tdln-pd1 simulate-spatial --initial-zones /tmp/spatial_initial.csv --patient-id example_patient --systemic-parameters /tmp/calibration/fitted_parameters.json --spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --days 3 --dose-days 0 --paired-counterfactual --output /tmp/spatial_patient.csv
          tdln-pd1 sensitivity --parameters tumour_growth,killing_rate --days 3 --samples 8 --output /tmp/sensitivity
          tdln-pd1 verify-sensitivity --audit /tmp/sensitivity/sensitivity_provenance.json
          tdln-pd1 spatial-sensitivity --spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --systemic-parameters /tmp/calibration/fitted_parameters.json --initial-zones /tmp/spatial_initial.csv --patient-id example_patient --parameters antigen_half_saturation,checkpoint_growth_gain --days 3 --dose-days 0 --samples 8 --output /tmp/spatial_sensitivity
          tdln-pd1 verify-sensitivity --audit /tmp/spatial_sensitivity/spatial_sensitivity_provenance.json --spatial-parameters /tmp/spatial_calibration/fitted_spatial_parameters.json --systemic-parameters /tmp/calibration/fitted_parameters.json --initial-zones /tmp/spatial_initial.csv
          tdln-pd1 verify --output /tmp/verification.json
