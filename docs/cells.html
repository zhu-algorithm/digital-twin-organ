<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>细胞与分子层 · 数字孪生器官</title>
<style>
  :root{--bg:#0b0e13;--panel:#141922;--line:#2a3340;--ink:#e6edf3;--dim:#8b97a8;--acc:#f0b429}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .wrap{max-width:1060px;margin:0 auto;padding:18px 16px 60px}
  a.back{color:#58a6ff;text-decoration:none;font-size:14px}
  h1{font-size:22px;margin:12px 0 4px}
  .tag{color:var(--dim);font-size:13.5px;margin-bottom:18px}
  .tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
  .tab{padding:8px 14px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
       cursor:pointer;font-size:14px;white-space:nowrap}
  .tab.on{background:#1f3a29;border-color:#2f6b43;color:#9fe0b4}
  .crumb{color:var(--dim);font-size:13px;margin-bottom:14px}
  .crumb b{color:var(--ink)}
  h2{font-size:12.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:26px 0 10px;font-weight:600}
  .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin-bottom:6px}
  .num{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
  .num .v{font-size:21px;font-variant-numeric:tabular-nums}
  .num .k{color:var(--dim);font-size:11px;margin-top:2px}
  .ct{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;
      margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:11px}
  .ct:hover{border-color:#3a4555}
  .ct.sel{border-color:#2f6b43;background:#15251c}
  .ct .bar{flex:0 0 76px;height:7px;background:#0f141c;border-radius:4px;overflow:hidden}
  .ct .bar i{display:block;height:100%;background:var(--acc)}
  .ct .nm{flex:1 1 auto;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ct .pc{flex:0 0 auto;color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums}
  .hint{color:var(--dim);font-size:12.5px;margin:-2px 0 10px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .gclass{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10.5px;border:1px solid var(--line)}
  .ebar{display:inline-block;height:7px;background:#58a6ff;border-radius:3px;vertical-align:middle}
  .miss{background:#2a1f0a;border:1px solid #6b4a12;border-radius:8px;padding:14px 16px;
        font-size:13.5px;color:#f5d9a0}
  .scroll{max-height:460px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px}
  code{background:#0f141c;padding:1px 5px;border-radius:4px;font-size:12px}

  /* Narrow screens: the cell-type name is the point of the row, so it gets its own
     full-width line above the bar and the statistics instead of being squeezed out. */
  @media (max-width:620px){
    .ct{flex-wrap:wrap;row-gap:7px;padding:11px 12px}
    .ct .nm{flex:1 1 100%;order:-1;white-space:normal;overflow:visible;text-overflow:clip;
            font-weight:600;line-height:1.35}
    .ct .bar{flex:0 0 54px}
    .ct .pc{flex:1 1 auto;font-size:12px;white-space:normal}
    .scroll{max-height:none}
    table{font-size:12.5px}
    th,td{padding:6px 5px}
    .wrap{padding:16px 13px 50px}
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 返回器官总览</a>
  <h1 id="title">细胞与分子层</h1>
  <div class="tag">数据来自 CELLxGENE Census 单细胞转录组。点击细胞类型可下钻到该细胞的药物代谢基因表达。</div>

  <div class="tabs" id="tabs"></div>
  <div class="crumb" id="crumb"></div>

  <h2>器官层</h2>
  <div class="nums" id="nums"></div>

  <h2>细胞层 — 细胞类型组成</h2>
  <div class="hint">按占器官细胞的比例降序。括号内为检出该类型的 donor 数；donor 间变异反映个体差异。</div>
  <div class="scroll" id="ctlist"></div>

  <h2>分子层 — ADME 基因表达</h2>
  <div id="mol"></div>

  <footer id="foot"></footer>
</div>

<script>
const GC_COLOR = {
  phase_I:'#e5484d', phase_II:'#f0b429', uptake_transporter:'#4a7fd4',
  efflux_transporter:'#bc8cff', nuclear_receptor:'#3fb950', housekeeping_reference:'#8b97a8'
};
const GC_LABEL = {
  phase_I:'I 相酶', phase_II:'II 相酶', uptake_transporter:'摄取转运体',
  efflux_transporter:'外排转运体', nuclear_receptor:'核受体', housekeeping_reference:'管家基因参考'
};
const ORGAN_LABEL = {kidney:'肾脏', liver:'肝脏', small_intestine:'小肠', esophagus:'食管', heart:'心脏'};
const ORDER = ['kidney','liver','small_intestine','esophagus','heart'];

let COMP=null, organ='kidney', selCT=null;
const EXPR = {};                 // organ -> parsed <organ>_expression.json (lazy)
const EXPR_STATE = {};           // organ -> 'loading' | 'ready' | 'absent'
/* Which organs have a cell-type-resolved ADME/ion-channel expression layer, and
   for those that do not, the reason — shown verbatim instead of a blank panel. */
const MOL_PENDING = {};
let GEVID = null;                 // heart only: per-gene gene/RNA/protein evidence
const CONF_LABEL = {
  one_to_one_pore_forming:'一对一·成孔亚基', multi_subunit_obligate:'多亚基·必需',
  principal_subunit_heteromeric:'主亚基·异聚体', regulatory_one_to_one:'调控·一对一',
  modulatory_not_represented:'调制·模型中无对应项', modulatory_disputed:'调制·有争议'
};
function molUnavailableNote(o){
  return MOL_PENDING[o] || '该器官的细胞类型分辨表达谱尚未取得。';
}

function fmt(n){return n.toLocaleString('en-US');}

function renderTabs(){
  document.getElementById('tabs').innerHTML = ORDER.map(o=>
    `<div class="tab ${o===organ?'on':''}" data-o="${o}">${ORGAN_LABEL[o]}</div>`).join('');
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    organ=t.dataset.o; selCT=null;
    document.getElementById('title').textContent = ORGAN_LABEL[organ]+' · 细胞与分子层';
    render();
    history.replaceState(null,'','?organ='+organ);
  });
}

function renderNums(){
  const c=COMP[organ];
  document.getElementById('nums').innerHTML =
    `<div class="num"><div class="v">${fmt(c.n_cells)}</div><div class="k">细胞数</div></div>`+
    `<div class="num"><div class="v">${c.n_cell_types}</div><div class="k">细胞类型</div></div>`+
    `<div class="num"><div class="v">${c.n_donors_total}</div><div class="k">donor 数</div></div>`+
    `<div class="num"><div class="v">${c.n_datasets}</div><div class="k">数据集</div></div>`;
}

function renderCellTypes(){
  const c=COMP[organ], mx=c.cell_types[0].pct;
  document.getElementById('ctlist').innerHTML = c.cell_types.map(ct=>{
    const w=(ct.pct/mx*100).toFixed(1);
    const sd = ct.donor_pct_sd==null?'':` ±${ct.donor_pct_sd.toFixed(1)}`;
    /* donors / clid are per-cell-type fields that not every organ's pull carries.
       When absent the clause is omitted rather than rendered as "undefined". */
    const dn = ct.donors==null?'':` · ${ct.donors} donor`;
    const ttl = ct.clid==null?'':` title="${ct.clid}"`;
    return `<div class="ct ${ct.name===selCT?'sel':''}" data-ct="${ct.name.replace(/"/g,'&quot;')}">
      <div class="bar"><i style="width:${w}%"></i></div>
      <div class="nm"${ttl}>${ct.name}</div>
      <div class="pc">${ct.pct.toFixed(2)}%${sd} · ${fmt(ct.n)} 细胞${dn}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.ct').forEach(e=>e.onclick=()=>{
    selCT = (selCT===e.dataset.ct)?null:e.dataset.ct; render();
  });
}

async function ensureExpr(o){
  if(EXPR_STATE[o]) return;
  EXPR_STATE[o]='loading';
  try{
    const r = await fetch(`data/${o}_expression.json`);
    if(!r.ok) throw new Error('absent');
    EXPR[o] = await r.json();
    if(o==='heart' && !GEVID){
      try{ GEVID = await (await fetch('data/heart_gene_evidence.json')).json(); }catch(e){ GEVID = null; }
    }
    EXPR_STATE[o]='ready';
  }catch(e){ EXPR_STATE[o]='absent'; }
  renderMolecular();
}

function renderMolecular(){
  const el=document.getElementById('mol');
  const st = EXPR_STATE[organ];
  if(st===undefined){ el.innerHTML='<div class="hint">正在载入分子层…</div>'; ensureExpr(organ); return; }
  if(st==='loading'){ el.innerHTML='<div class="hint">正在载入分子层…</div>'; return; }
  if(st==='absent'){
    el.innerHTML = `<div class="miss"><b>${ORGAN_LABEL[organ]}的分子层尚未就绪。</b>
      上方的细胞类型组成已经来自真实单细胞测序数据，但细胞类型分辨的基因表达谱还没有。<br><br>
      ${molUnavailableNote(organ)}<br><br>
      此处<b>不会用组织平均值替代</b>：组织平均值分辨不了细胞类型，
      而区分心室肌细胞与成纤维细胞、肝细胞与胆管细胞正是本模型的关键。缺失就如实显示缺失。</div>`;
    return;
  }
  const X = EXPR[organ];
  if(!selCT){
    el.innerHTML = `<div class="hint">在上方细胞层点选一种细胞类型，查看它的 ${X.genes.length} 个基因表达。
      本器官已覆盖 <b>${X.cell_types.length}</b> 种细胞类型的表达谱。</div>` + zonationPanel();
    return;
  }
  const i = X.cell_types.indexOf(selCT);
  if(i<0){
    el.innerHTML = `<div class="miss">该细胞类型没有表达谱数据。
      本器官的表达谱覆盖 ${X.cell_types.length} 种细胞类型（细胞类型组成表有 ${COMP[organ].n_cell_types} 种）——
      未覆盖的类型或是细胞数低于统计阈值（≥50 细胞），或是所用数据集未包含。</div>` + zonationPanel();
    return;
  }
  const rows = X.genes.map((g,j)=>({gene:g, cls:X.gene_class[j], e:X.expr[i][j], p:X.pct[i][j]}))
                      .filter(r=>r.e!=null).sort((a,b)=>b.e-a.e);
  const mx = rows.length?rows[0].e:1;
  el.innerHTML =
    `<div class="hint"><b>${selCT}</b> — ${fmt(X.n_cells[i])} 个细胞（统计用 ${fmt(X.n_cells_used[i])} 个）、
     ${X.n_donors[i]} 位 donor。表达量为 ${X.normalization}，按表达量降序。</div>
     <table><thead><tr><th>基因</th><th>分类</th><th>平均表达</th><th>表达细胞比例</th>`+
     (organ==='heart' && GEVID ? `<th>ORd 电流·参数</th><th>蛋白证据</th><th>致病变异</th>` : '') +
     `</tr></thead><tbody>`+
    rows.map(r=>{
      const ev = (organ==='heart' && GEVID) ? GEVID[r.gene] : null;
      let extra = '';
      if(ev){
        const cur = ev.ord_parameter && ev.maps
          ? `<span style="color:#f0b429">${ev.ord_current} · ${ev.ord_parameter}</span>` : '<span style="color:#8b97a8">—</span>';
        const pr = ev.protein==='detected'
          ? `<span style="color:#3fb950">检出${ev.protein_peptides?` ${ev.protein_peptides} 肽`:''}</span>`
          : '<span style="color:#f0883e">未检出</span>';
        const pl = ev.plp ? `<span style="color:#bc8cff">${ev.plp.toLocaleString('en-US')}</span>` : '<span style="color:#8b97a8">—</span>';
        extra = `<td>${cur}</td><td>${pr}</td><td>${pl}</td>`;
      }
      return `<tr>
      <td><b>${r.gene}</b></td>
      <td><span class="gclass" style="color:${GC_COLOR[r.cls]||'#8b97a8'};border-color:${GC_COLOR[r.cls]||'#2a3340'}">${GC_LABEL[r.cls]||r.cls}</span></td>
      <td><span class="ebar" style="width:${Math.max(2,r.e/mx*72)}px;background:${GC_COLOR[r.cls]||'#58a6ff'}"></span>
          <span style="color:var(--dim);font-size:12px;margin-left:7px">${r.e.toFixed(3)}</span></td>
      <td>${r.p.toFixed(1)}%</td>${extra}</tr>`;}).join('')+
    `</tbody></table>` + evidenceNote() + zonationPanel();
}

/* Heart only: the asymmetry between the three evidence layers is the finding, so it is
   stated on the page rather than left for the reader to infer from blank cells. */
function evidenceNote(){
  if(organ!=='heart' || !GEVID) return '';
  const mapped = Object.values(GEVID).filter(v=>v.maps);
  const noProt = mapped.filter(v=>v.protein!=='detected');
  return `<div class="miss" style="margin-top:14px">
    <b>三层证据并不对等，而且缺口恰好落在模型最需要的地方。</b>
    51 个基因中 <b>${mapped.length}</b> 个映射到 O'Hara-Rudy 动作电位模型的某个参数，
    其中 <b>${noProt.length}</b> 个在最深的人类心脏蛋白组中<b>完全没有蛋白证据</b>：
    ${Object.entries(GEVID).filter(([g,v])=>v.maps&&v.protein!=='detected').map(([g])=>g).join('、')}。
    这包含 IKr 的全部亚基（KCNH2、KCNE2）、IK1（KCNJ2、KCNJ12）、Ito（KCND3、KCNIP2）与 IKs 的 β 亚基（KCNE1）——
    <b>模型的四条钾电流没有任何实测蛋白锚点</b>。
    <br><br>
    <b>离子通道没有任何绝对定量。</b>PRIDE 以「absolute quantification heart」检索人类样本返回 0 项。
    最深的心脏蛋白组确实报告了每二倍体核拷贝数，但那是用组蛋白蛋白组标尺推算的、明示「无加标标准品」，
    属于由 LFQ 强度算出的估计而非标定测量。本站所有蛋白数值一律标为<b>相对 LFQ</b>。
    <br><br>
    <b>因此闭环只能走遗传这一层。</b>KCNH2 功能丧失与药物阻断 hERG 作用于同一个可调参数 GKr，
    该通路已验证（50% 阻断使 APD90 由 266.1 ms 延长至 382.7 ms），<b>且不需要任何蛋白丰度</b>。
    而「表达量 → 电导」的丰度驱动闭环<b>不被支持</b>：既无绝对定量，也无任何把丰度标定到电导的依据。
    <br><br>
    <b>跨壁（心内膜／中层／心外膜）数据不存在。</b>Census 的心脏组织轴共 19 个术语，没有一个编码心室壁分层，
    所以 ORd 的 Ito 跨壁梯度在本项目中<b>没有分子层依据</b>，全心室的 KCND3／KCNIP2 值不得当作分层数据使用。
  </div>`;
}

/* Liver only: the three hepatocyte zones are separate cell types in the atlas, so the
   lobular gradient can be read directly. Reported per gene — it is NOT uniform. */
function zonationPanel(){
  if(organ!=='liver' || EXPR_STATE.liver!=='ready') return '';
  const X = EXPR.liver;
  const zones = ['periportal region hepatocyte','midzonal region hepatocyte','centrilobular region hepatocyte'];
  const zi = zones.map(z=>X.cell_types.indexOf(z));
  if(zi.some(i=>i<0)) return '';
  const show = ['CYP3A4','CYP1A2','CYP2C9','CYP2D6','CYP2C19','UGT2B7','SLCO1B1','ABCB11'];
  const rows = show.map(g=>{
    const j = X.genes.indexOf(g); if(j<0) return null;
    const v = zi.map(i=>X.expr[i][j]);
    if(v.some(x=>x==null)) return null;
    const ratio = v[0] > 0 ? v[2]/v[0] : NaN;
    const dir = ratio > 1.15 ? '中央静脉周围偏高' : (ratio < 0.87 ? '门脉周围偏高' : '无明显梯度');
    const col = ratio > 1.15 ? '#e5484d' : (ratio < 0.87 ? '#4a7fd4' : '#8b97a8');
    return `<tr><td><b>${g}</b></td><td>${v[0].toFixed(3)}</td><td>${v[1].toFixed(3)}</td>
            <td>${v[2].toFixed(3)}</td><td style="color:${col}">${isFinite(ratio)?ratio.toFixed(2)+'×':'—'} · ${dir}</td></tr>`;
  }).filter(Boolean).join('');
  return `<h2 style="margin-top:22px">肝小叶分区梯度</h2>
    <div class="hint">图谱把肝细胞按小叶位置注释成三种独立细胞类型，所以分区梯度可以直接读出。
      末列是 中央静脉周围 ÷ 门脉周围 的比值。<b>梯度并非对所有基因一致</b>——这与已知的 CYP 区域异质性相符，
      不是全局性的单向梯度。</div>
    <table><thead><tr><th>基因</th><th>门脉周围</th><th>中间带</th><th>中央静脉周围</th><th>比值与方向</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function renderCrumb(){
  const parts = [`<b>${ORGAN_LABEL[organ]}</b>`, selCT?`<b>${selCT}</b>`:'细胞类型', (organ==='kidney'&&selCT)?'<b>ADME 基因</b>':'分子层'];
  document.getElementById('crumb').innerHTML = '器官 › 细胞 › 分子　—　' + parts.join(' › ');
}

function renderFoot(){
  document.getElementById('foot').innerHTML =
   `数据来源：CELLxGENE Census 2025-11-08，人类正常组织、10x 系列测序、
    <code>is_primary_data=True</code>。细胞过滤：检出基因数 ≥200、总 counts ≥500；
    细胞类型需 ≥50 个细胞方纳入表达谱统计。细胞类型标签取自 Census 的 Cell Ontology 注释，未重新聚类。
    质控未做 doublet 检测与线粒体比例过滤（Census 的 obs 不提供线粒体字段，计算需读取表达矩阵，成本不可接受）。
    <br><br>本项目为研究用模拟器，<b>不可用于任何临床给药决策</b>。`;
}

function render(){ renderTabs(); renderNums(); renderCellTypes(); renderMolecular(); renderCrumb(); }

fetch('data/cell_composition.json').then(r=>r.json()).then(c=>{
  COMP=c;
  const q=new URLSearchParams(location.search).get('organ');
  if(q && COMP[q]) organ=q;
  document.getElementById('title').textContent = ORGAN_LABEL[organ]+' · 细胞与分子层';
  render(); renderFoot();
}).catch(e=>{
  document.getElementById('nums').innerHTML =
    `<div class="miss">数据加载失败：${e}。若在本地直接双击打开此文件，浏览器会阻止读取 data/ 目录；
     请通过线上地址访问，或在目录下启动 <code>python3 -m http.server</code>。</div>`;
});
</script>
</body>
</html>
